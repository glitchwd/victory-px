name: Linux release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release

jobs:
  publish:
    if: github.ref == 'refs/heads/lighthouse'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and package
        working-directory: victory-px-rs
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=." cargo +stable build --release --locked
      - name: Assemble archive
        run: |
          mkdir -p dist/package
          cp victory-px-rs/target/release/victory-px dist/package/
          version=$(dist/package/victory-px --version)
          echo "RELEASE_VERSION=v${version#victory-px }" >> "$GITHUB_ENV"
          cp README.md LICENSE dist/package/
          tar -czf dist/victory-px-linux-amd64.tar.gz -C dist/package victory-px README.md LICENSE
          (cd dist && sha256sum victory-px-linux-amd64.tar.gz > SHA256SUMS)
      - name: Publish and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_status=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_status" == true ]]; then
            gh release upload "$RELEASE_VERSION" dist/victory-px-linux-amd64.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_VERSION" --draft=false
          elif [[ "$release_status" != false ]]; then
            gh release create "$RELEASE_VERSION" dist/victory-px-linux-amd64.tar.gz dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "Victory-PX $RELEASE_VERSION" \
              --notes 'Linux x86-64 Rust launcher with Gamescope, live telemetry, and Lighthouse reports.'
          fi
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = false
          mkdir -p dist/verify
          gh release download "$RELEASE_VERSION" --dir dist/verify --pattern victory-px-linux-amd64.tar.gz --pattern SHA256SUMS
          (cd dist/verify && sha256sum --check SHA256SUMS)
