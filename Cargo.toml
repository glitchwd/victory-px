[package]
name = "victory-px"
version = "0.2.1"
edition = "2021"
description = "Linux TUI launcher and telemetry monitor for VIctory builds (ratatui)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
signal-hook = "0.3"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
